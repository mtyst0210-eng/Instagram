<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>月間タスク管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f6;
    --surface: #ffffff;
    --surface-2: #f2ece9;
    --border: #e4dcd7;
    --ink: #2a2522;
    --text: #2a2522;
    --text-muted: #8d8079;
    --accent: #b3717a;
    --accent-soft: #f3e3e2;
    --accent-contrast: #ffffff;
    --ink-contrast: #faf8f6;
    --good: #7c8a70;
    --good-soft: #eaece2;
    --cat-other: #ab8a4c;
    --danger: #a5644f;
    --danger-soft: #f1e2da;
    --ring-track: #ece4e0;
    --shadow: 0 1px 2px rgba(42,37,34,0.04), 0 10px 28px -18px rgba(42,37,34,0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18161a;
      --surface: #201d21;
      --surface-2: #29262a;
      --border: #3a353a;
      --ink: #f1ece8;
      --text: #f1ece8;
      --text-muted: #a89e9b;
      --accent: #d99aa1;
      --accent-soft: #372a2c;
      --accent-contrast: #221316;
      --ink-contrast: #18161a;
      --good: #a0ac93;
      --good-soft: #2b2f26;
      --cat-other: #cdab6c;
      --danger: #cb8872;
      --danger-soft: #33241f;
      --ring-track: #332f33;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -18px rgba(0,0,0,0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #18161a;
    --surface: #201d21;
    --surface-2: #29262a;
    --border: #3a353a;
    --ink: #f1ece8;
    --text: #f1ece8;
    --text-muted: #a89e9b;
    --accent: #d99aa1;
    --accent-soft: #372a2c;
    --accent-contrast: #221316;
    --ink-contrast: #18161a;
    --good: #a0ac93;
    --good-soft: #2b2f26;
    --cat-other: #cdab6c;
    --danger: #cb8872;
    --danger-soft: #33241f;
    --ring-track: #332f33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -18px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 100px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 40px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; padding: 32px 20px 72px; gap: 32px; }
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }

  .brand {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @media (min-width: 861px) {
    .sidebar {
      position: sticky;
      top: 24px;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 28px 26px;
    box-shadow: var(--shadow);
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .month-nav button {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .month-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .month-nav button:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 1px solid var(--accent); outline-offset: 3px;
  }

  .month-title {
    font-family: "Shippori Mincho", serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .ring-wrap {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .ring-num .pct-line {
    font-family: "Shippori Mincho", serif;
    line-height: 1;
  }
  .ring-num .pct { font-size: 34px; font-weight: 600; }
  .ring-num .pct-sign { font-size: 15px; color: var(--text-muted); margin-left: 1px; }
  .ring-num .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }
  .status {
    font-family: "Shippori Mincho", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--accent);
    margin-top: 16px;
    min-height: 1.3em;
    text-wrap: balance;
  }

  .stat-row {
    display: flex;
    margin-top: 26px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .stat {
    flex: 1;
    padding-right: 16px;
  }
  .stat + .stat { border-left: 1px solid var(--border); padding-left: 16px; }
  .stat .n {
    font-family: "Shippori Mincho", serif;
    font-size: 22px;
    font-weight: 500;
  }
  .stat .l {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .stat.danger .n { color: var(--danger); }

  .goal-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 9px;
  }
  .goal-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 0;
    padding: 4px 1px 8px;
    font-size: 13.5px;
    font-family: inherit;
    transition: border-color .15s;
  }
  .goal-input:focus { border-bottom-color: var(--accent); outline: none; }

  form.add-task { display: flex; flex-direction: column; gap: 18px; }
  .field label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  .field input[type="text"], .field input[type="date"], .field select {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 0;
    padding: 4px 1px 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-bottom-color: var(--accent); outline: none; }
  .field-row { display: flex; gap: 18px; }
  .field-row .field { flex: 1; }

  .date-field { position: relative; }

  .date-picker-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 4px 1px 8px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s;
  }
  .date-picker-trigger svg { flex: none; color: var(--text-muted); transition: transform .15s; }
  .date-picker-trigger[aria-expanded="true"] { border-bottom-color: var(--accent); }
  .date-picker-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }

  .date-picker-pop {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .dp-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .dp-month {
    font-family: "Shippori Mincho", serif;
    font-size: 15px;
  }
  .dp-nav button {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .dp-nav button:hover { border-color: var(--accent); color: var(--accent); }

  .dp-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .dp-weekdays span {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .dp-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 2px;
  }
  .dp-grid .dp-day {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-family: "Shippori Mincho", serif;
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    justify-self: center;
    width: 30px;
    position: relative;
  }
  .dp-grid .dp-day:hover { background: var(--surface-2); }
  .dp-grid .dp-day.today { color: var(--accent); }
  .dp-grid .dp-day.selected { background: var(--accent); color: var(--accent-contrast); }
  .dp-grid .dp-day.empty { cursor: default; }
  .dp-grid .dp-day.empty:hover { background: transparent; }

  .dp-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .dp-actions button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 0;
  }
  .dp-actions button:hover { color: var(--accent); }
  .dp-actions .dp-done {
    margin-left: auto;
    background: var(--ink);
    color: var(--ink-contrast);
    padding: 7px 16px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }
  .dp-actions .dp-done:hover { color: var(--ink-contrast); opacity: 0.82; }

  button.primary {
    background: var(--ink);
    color: var(--ink-contrast);
    border: none;
    border-radius: 2px;
    padding: 13px 14px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .15s;
  }
  button.primary:hover { opacity: 0.82; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .anytime-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .anytime-count {
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    color: var(--text-muted);
  }
  .anytime-list { margin-bottom: 14px; }
  .anytime-add {
    display: flex;
    gap: 12px;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .anytime-add input {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 1px 7px;
  }
  .anytime-add input:focus { outline: none; border-bottom-color: var(--accent); }
  .anytime-add button {
    flex: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    padding: 7px 14px;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .anytime-add button:hover { border-color: var(--accent); color: var(--accent); }

  .text-link {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
  }
  .text-link:hover { color: var(--accent); text-decoration-color: var(--accent); }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; gap: 22px; }

  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px 34px;
    box-shadow: var(--shadow);
  }
  .today-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .today-head .today-title {
    font-family: "Shippori Mincho", serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .today-head .today-date {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .task-list { display: flex; flex-direction: column; }

  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
  }
  .task-list .task-row:last-child { border-bottom: none; }

  .task-row .chk {
    width: 19px; height: 19px;
    border-radius: 50%;
    border: 1px solid var(--text-muted);
    background: transparent;
    cursor: pointer;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast);
    transition: background .15s, border-color .15s;
  }
  .task-row .chk:hover { border-color: var(--accent); }
  .task-row .chk.done { background: var(--accent); border-color: var(--accent); }
  .task-row .chk svg { width: 11px; height: 11px; display: none; }
  .task-row .chk.done svg { display: block; }

  .task-row .title {
    flex: 1;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
  }
  .task-row.done .title { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--border); }
  .task-row .title .label { overflow-wrap: anywhere; }

  .cat-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    flex: none;
    position: relative;
    top: -1px;
  }
  .cat-dot.cat-agency { background: var(--accent); }
  .cat-dot.cat-own { background: var(--good); }
  .cat-dot.cat-other { background: var(--cat-other); }

  .task-row .del {
    flex: none;
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    opacity: 0.45;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, color .15s;
  }
  .task-row .del svg { width: 12px; height: 12px; }
  .task-row:hover .del { opacity: 1; }
  .task-row .del:hover { color: var(--danger); }
  .task-row .edit-btn:hover { color: var(--accent); }

  .task-edit {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 2px;
    align-items: stretch;
  }
  .task-edit .edit-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .task-edit input[type="text"] {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 3px 1px 7px;
  }
  .task-edit select,
  .task-edit input[type="date"] {
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    padding: 3px 1px 7px;
    min-width: 0;
  }
  .task-edit select { flex: 1; }
  .task-edit input[type="date"] { flex: 1; }
  .task-edit input:focus, .task-edit select:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .task-edit .edit-save, .task-edit .edit-cancel {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .task-edit .edit-save { color: var(--accent); border-color: var(--accent); }
  .task-edit .edit-save svg { width: 12px; height: 12px; }
  .task-edit .edit-save:hover { background: var(--accent); color: var(--accent-contrast); }
  .task-edit .edit-cancel { color: var(--text-muted); font-size: 14px; }
  .task-edit .edit-cancel:hover { color: var(--danger); border-color: var(--danger); }

  .empty-note {
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    font-family: "Shippori Mincho", serif;
    padding: 10px 2px;
  }

  .seed-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    color: var(--text);
    border-radius: 0;
    padding: 13px 18px;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .seed-banner button {
    background: transparent;
    border: none;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    font-size: 12px;
    flex: none;
  }

  .weeks { display: flex; flex-direction: column; gap: 18px; }

  .week-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
  }
  .week-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .week-head .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--text-muted);
  }
  .week-head .frac {
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    color: var(--text-muted);
  }

  .day-row {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 16px;
    padding: 11px 0;
    border-top: 1px solid var(--border);
  }
  .day-row:first-of-type { border-top: none; }
  .day-row.today { border-left: 2px solid var(--accent); padding-left: 12px; margin-left: -14px; }

  .day-num {
    font-family: "Shippori Mincho", serif;
    padding-top: 9px;
  }
  .day-num .n { font-size: 17px; font-weight: 500; }
  .day-num .w { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; font-family: "Zen Kaku Gothic New", sans-serif; letter-spacing: 0.05em; }

  .day-tasks { display: flex; flex-direction: column; }
  .day-tasks .task-row { border-bottom: none; padding: 6px 2px; }
  .day-tasks .empty-note { padding: 9px 2px; font-size: 12.5px; }

  footer.hint {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">月間タスク管理</div>

    <div class="card">
      <div class="month-nav">
        <button id="prevMonth" aria-label="前の月">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button id="nextMonth" aria-label="次の月">›</button>
      </div>

      <div class="ring-wrap">
        <svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="今月の達成率">
          <circle cx="42" cy="42" r="37" fill="none" stroke="var(--ring-track)" stroke-width="2.5"/>
          <circle id="ringProgress" cx="42" cy="42" r="37" fill="none" stroke="var(--accent)" stroke-width="2.5"
                  stroke-linecap="round" transform="rotate(-90 42 42)"/>
        </svg>
        <div class="ring-num">
          <div class="pct-line"><span class="pct" id="pctText">0</span><span class="pct-sign">%</span></div>
          <div class="sub" id="doneOfTotal">0 / 0 件完了</div>
        </div>
      </div>
      <div class="status" id="ringStatus"></div>

      <div class="stat-row">
        <div class="stat">
          <div class="n" id="statRemaining">0</div>
          <div class="l">残タスク</div>
        </div>
        <div class="stat danger">
          <div class="n" id="statOverdue">0</div>
          <div class="l">期限超過</div>
        </div>
      </div>

      <div style="margin-top:16px;">
        <div class="goal-label">今月の目標</div>
        <input class="goal-input" id="goalInput" type="text" placeholder="例：クライアント対応と自分の投稿、両方を滞りなく進める" />
      </div>
    </div>

    <div class="card">
      <div class="goal-label" style="margin-bottom:12px;">タスクを追加</div>
      <form class="add-task" id="addForm">
        <div class="field">
          <label for="taskTitle">やること</label>
          <input type="text" id="taskTitle" placeholder="例：「工務店」投稿作成" required />
        </div>
        <div class="field">
          <label for="taskCategory">分類</label>
          <select id="taskCategory">
            <option value="agency">運用代行</option>
            <option value="own">自身アカウント</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="field date-field">
          <label for="datePickerBtn">日にち（複数選択可）</label>
          <button type="button" class="date-picker-trigger" id="datePickerBtn" aria-haspopup="true" aria-expanded="false">
            <span id="datePickerSummary">日付を選択</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="date-picker-pop" id="datePickerPop" hidden>
            <div class="dp-nav">
              <button type="button" id="dpPrev" aria-label="前の月">‹</button>
              <div class="dp-month" id="dpMonthLabel"></div>
              <button type="button" id="dpNext" aria-label="次の月">›</button>
            </div>
            <div class="dp-weekdays">
              <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            <div class="dp-grid" id="dpGrid"></div>
            <div class="dp-actions">
              <button type="button" id="dpSelectAll">すべて</button>
              <button type="button" id="dpSelectWeekday">平日のみ</button>
              <button type="button" id="dpClear">クリア</button>
              <button type="button" id="dpDone" class="dp-done">決定</button>
            </div>
          </div>
        </div>
        <button type="submit" class="primary">追加する</button>
      </form>

      <div class="legend">
        <span><i class="cat-dot cat-agency"></i>運用代行</span>
        <span><i class="cat-dot cat-own"></i>自身アカウント</span>
        <span><i class="cat-dot cat-other"></i>その他</span>
      </div>
    </div>

    <div class="card">
      <div class="anytime-head">
        <div class="goal-label" style="margin-bottom:0;">時間が空いたら進める</div>
        <div class="anytime-count" id="anytimeCount">0 / 0</div>
      </div>
      <div class="task-list anytime-list" id="anytimeList"></div>
      <form class="anytime-add" id="anytimeForm">
        <input type="text" id="anytimeTitle" placeholder="例：来月の企画を考える" required />
        <button type="submit">追加</button>
      </form>
    </div>

    <button type="button" class="text-link" id="resetTemplateBtn">この月をテンプレートで入れ直す</button>
  </aside>

  <main class="main">
    <section class="today-card">
      <div class="today-head">
        <div class="today-title">今日やること</div>
        <div class="today-date" id="todayDate"></div>
      </div>
      <div class="task-list" id="todayList"></div>
    </section>

    <section>
      <div id="seedBannerWrap"></div>
      <div class="weeks" id="weeks"></div>
      <footer class="hint">タスクはこの端末のブラウザ内に保存されます（他の端末とは共有されません）。</footer>
    </section>
  </main>

</div>

<script>
(function () {
  "use strict";

  const STORAGE_PREFIX = "mtm:tasks:";
  const GOAL_PREFIX = "mtm:goal:";
  const SEED_FLAG = "mtm:seeded";

  const pad2 = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const monthKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

  const WEEKDAYS = ["日","月","火","水","木","金","土"];

  let today = startOfDay(new Date());
  let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

  function loadTasks(key) {
    try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + key)) || []; }
    catch (e) { return []; }
  }
  function saveTasks(key, tasks) {
    try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(tasks)); } catch (e) {}
  }
  function loadGoal(key) {
    try { return localStorage.getItem(GOAL_PREFIX + key) || ""; } catch (e) { return ""; }
  }
  function saveGoal(key, val) {
    try { localStorage.setItem(GOAL_PREFIX + key, val); } catch (e) {}
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }

  // 大枠の項目（運用代行 / 自身アカウント / その他）に沿った月間テンプレート。
  // day は「その月の何日」を指す（末日を超える分は末日にまとめる）。
  const TEMPLATE = [
    { day: 2,  title: "「工務店」投稿作成", category: "agency" },
    { day: 3,  title: "「タイ古式マッサージ店」ストーリー更新", category: "agency" },
    { day: 4,  title: "リール撮影", category: "own" },
    { day: 5,  title: "リール編集", category: "own" },
    { day: 6,  title: "「タイ古式マッサージ店」投稿作成", category: "agency" },
    { day: 8,  title: "「工務店」投稿作成", category: "agency" },
    { day: 9,  title: "自身アカウント ストーリー更新", category: "own" },
    { day: 11, title: "リール作成（投稿）", category: "own" },
    { day: 13, title: "「タイ古式マッサージ店」ストーリー更新", category: "agency" },
    { day: 15, title: "「工務店」投稿作成", category: "agency" },
    { day: 17, title: "「タイ古式マッサージ店」投稿作成", category: "agency" },
    { day: 20, title: "自身アカウント ストーリー更新", category: "own" },
    { day: 22, title: "「工務店」投稿作成", category: "agency" },
    { day: 25, title: "リール撮影", category: "own" },
    { day: 27, title: "リール編集", category: "own" },
    { day: 28, title: "請求書作成", category: "other" },
    { day: 30, title: "振り返りシート・成果報告書を提出", category: "other" },
  ];

  function buildTemplateTasks(year, month) {
    const lastDay = new Date(year, month + 1, 0).getDate();
    const clamp = n => Math.min(Math.max(n, 1), lastDay);
    return TEMPLATE.map(t => {
      const date = toISO(new Date(year, month, clamp(t.day)));
      return { id: uid(), date, title: t.title, category: t.category, done: date < toISO(today) };
    });
  }

  function seedIfNeeded() {
    try { if (localStorage.getItem(SEED_FLAG)) return; } catch (e) { return; }
    const key = monthKey(today);
    const existing = loadTasks(key);
    if (existing.length) { localStorage.setItem(SEED_FLAG, "1"); return; }

    saveTasks(key, buildTemplateTasks(today.getFullYear(), today.getMonth()));
    saveGoal(key, "クライアント対応と自分の投稿、両方を滞りなく進める");
    localStorage.setItem(SEED_FLAG, "1");
    showSeedBanner();
  }

  let seedBannerShown = false;
  function showSeedBanner() { seedBannerShown = true; }

  // ---------- date picker (multi-select calendar dropdown) ----------

  const datePickerBtn = document.getElementById("datePickerBtn");
  const datePickerPop = document.getElementById("datePickerPop");
  const datePickerSummary = document.getElementById("datePickerSummary");
  const dpMonthLabelEl = document.getElementById("dpMonthLabel");
  const dpGridEl = document.getElementById("dpGrid");

  let dpViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  const selectedDates = new Set([toISO(today)]);

  function formatDateJP(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return `${y}年${m}月${d}日`;
  }

  function updateDatePickerSummary() {
    const n = selectedDates.size;
    if (n === 0) datePickerSummary.textContent = "日付を選択";
    else if (n === 1) datePickerSummary.textContent = formatDateJP([...selectedDates][0]);
    else datePickerSummary.textContent = `${formatDateJP([...selectedDates].sort()[0])} 他${n - 1}日`;
  }

  function renderDatePicker() {
    const year = dpViewDate.getFullYear(), month = dpViewDate.getMonth();
    dpMonthLabelEl.textContent = `${year}年${month + 1}月`;
    dpGridEl.innerHTML = "";

    const firstWeekday = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstWeekday; i++) {
      const filler = document.createElement("div");
      filler.className = "dp-day empty";
      dpGridEl.appendChild(filler);
    }
    for (let d = 1; d <= lastDay; d++) {
      const iso = toISO(new Date(year, month, d));
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dp-day";
      if (iso === toISO(today)) btn.classList.add("today");
      if (selectedDates.has(iso)) btn.classList.add("selected");
      btn.textContent = String(d);
      btn.addEventListener("click", () => {
        if (selectedDates.has(iso)) selectedDates.delete(iso);
        else selectedDates.add(iso);
        renderDatePicker();
        updateDatePickerSummary();
      });
      dpGridEl.appendChild(btn);
    }
  }

  function openDatePicker() {
    datePickerPop.hidden = false;
    datePickerBtn.setAttribute("aria-expanded", "true");
  }
  function closeDatePicker() {
    datePickerPop.hidden = true;
    datePickerBtn.setAttribute("aria-expanded", "false");
  }

  datePickerBtn.addEventListener("click", () => {
    if (datePickerPop.hidden) openDatePicker(); else closeDatePicker();
  });
  document.addEventListener("click", e => {
    if (!datePickerPop.hidden && !e.target.closest(".date-field")) closeDatePicker();
  }, true);
  document.getElementById("dpPrev").addEventListener("click", () => {
    dpViewDate = new Date(dpViewDate.getFullYear(), dpViewDate.getMonth() - 1, 1);
    renderDatePicker();
  });
  document.getElementById("dpNext").addEventListener("click", () => {
    dpViewDate = new Date(dpViewDate.getFullYear(), dpViewDate.getMonth() + 1, 1);
    renderDatePicker();
  });
  document.getElementById("dpSelectAll").addEventListener("click", () => {
    const year = dpViewDate.getFullYear(), month = dpViewDate.getMonth();
    const lastDay = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= lastDay; d++) selectedDates.add(toISO(new Date(year, month, d)));
    renderDatePicker();
    updateDatePickerSummary();
  });
  document.getElementById("dpSelectWeekday").addEventListener("click", () => {
    const year = dpViewDate.getFullYear(), month = dpViewDate.getMonth();
    const lastDay = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= lastDay; d++) {
      const date = new Date(year, month, d);
      const wd = date.getDay();
      if (wd !== 0 && wd !== 6) selectedDates.add(toISO(date));
    }
    renderDatePicker();
    updateDatePickerSummary();
  });
  document.getElementById("dpClear").addEventListener("click", () => {
    selectedDates.clear();
    renderDatePicker();
    updateDatePickerSummary();
  });
  document.getElementById("dpDone").addEventListener("click", () => closeDatePicker());

  renderDatePicker();
  updateDatePickerSummary();

  // ---------- anytime list (no date, sits beside the calendar) ----------

  const ANYTIME_KEY = "mtm:anytime";
  const anytimeListEl = document.getElementById("anytimeList");
  const anytimeCountEl = document.getElementById("anytimeCount");

  function loadAnytime() {
    try { return JSON.parse(localStorage.getItem(ANYTIME_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveAnytime(list) {
    try { localStorage.setItem(ANYTIME_KEY, JSON.stringify(list)); } catch (e) {}
  }

  let anytimeTasks = loadAnytime();
  let editingAnytimeId = null;

  function renderAnytimeRow(task) {
    if (task.id === editingAnytimeId) return renderAnytimeEditRow(task);

    const row = document.createElement("div");
    row.className = "task-row" + (task.done ? " done" : "");

    const chk = document.createElement("button");
    chk.className = "chk" + (task.done ? " done" : "");
    chk.innerHTML = checkIcon();
    chk.setAttribute("aria-label", task.done ? "完了を取り消す" : "完了にする");
    chk.addEventListener("click", () => toggleAnytime(task.id));

    const title = document.createElement("div");
    title.className = "title";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = task.title;
    title.appendChild(label);

    const edit = document.createElement("button");
    edit.className = "del edit-btn";
    edit.innerHTML = editIcon();
    edit.setAttribute("aria-label", "編集");
    edit.addEventListener("click", () => { editingAnytimeId = task.id; renderAnytime(); });

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "削除");
    del.addEventListener("click", () => deleteAnytime(task.id));

    row.appendChild(chk);
    row.appendChild(title);
    row.appendChild(edit);
    row.appendChild(del);
    return row;
  }

  function renderAnytimeEditRow(task) {
    const row = document.createElement("div");
    row.className = "task-row task-edit";

    const titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.className = "edit-title";
    titleInput.value = task.title;

    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "edit-save";
    saveBtn.innerHTML = checkIcon();
    saveBtn.setAttribute("aria-label", "保存");

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "edit-cancel";
    cancelBtn.textContent = "×";
    cancelBtn.setAttribute("aria-label", "編集をやめる");

    const doSave = () => {
      const v = titleInput.value.trim();
      if (!v) return;
      const t = anytimeTasks.find(x => x.id === task.id);
      if (t) t.title = v;
      saveAnytime(anytimeTasks);
      editingAnytimeId = null;
      renderAnytime();
    };
    saveBtn.addEventListener("click", doSave);
    cancelBtn.addEventListener("click", () => { editingAnytimeId = null; renderAnytime(); });
    titleInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); doSave(); }
      if (e.key === "Escape") { editingAnytimeId = null; renderAnytime(); }
    });

    const line = document.createElement("div");
    line.className = "edit-row";
    line.appendChild(titleInput);
    line.appendChild(saveBtn);
    line.appendChild(cancelBtn);
    row.appendChild(line);
    return row;
  }

  function toggleAnytime(id) {
    const t = anytimeTasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    saveAnytime(anytimeTasks);
    renderAnytime();
  }
  function deleteAnytime(id) {
    anytimeTasks = anytimeTasks.filter(x => x.id !== id);
    saveAnytime(anytimeTasks);
    renderAnytime();
  }

  function renderAnytime() {
    anytimeListEl.innerHTML = "";
    if (!anytimeTasks.length) {
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "空いた時間にやることを追加しましょう";
      anytimeListEl.appendChild(empty);
    } else {
      anytimeTasks.forEach(t => anytimeListEl.appendChild(renderAnytimeRow(t)));
    }
    const done = anytimeTasks.filter(t => t.done).length;
    anytimeCountEl.textContent = `${done} / ${anytimeTasks.length}`;
  }

  document.getElementById("anytimeForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("anytimeTitle");
    const v = input.value.trim();
    if (!v) return;
    anytimeTasks.push({ id: uid(), title: v, done: false });
    saveAnytime(anytimeTasks);
    input.value = "";
    renderAnytime();
  });

  renderAnytime();

  // ---------- rendering ----------

  const monthTitleEl = document.getElementById("monthTitle");
  const todayDateEl = document.getElementById("todayDate");
  const todayListEl = document.getElementById("todayList");
  const weeksEl = document.getElementById("weeks");
  const pctTextEl = document.getElementById("pctText");
  const doneOfTotalEl = document.getElementById("doneOfTotal");
  const statRemainingEl = document.getElementById("statRemaining");
  const statOverdueEl = document.getElementById("statOverdue");
  const ringProgressEl = document.getElementById("ringProgress");
  const goalInputEl = document.getElementById("goalInput");
  const seedBannerWrap = document.getElementById("seedBannerWrap");
  const ringStatusEl = document.getElementById("ringStatus");
  const RING_CIRC = 2 * Math.PI * 37;
  ringProgressEl.style.strokeDasharray = String(RING_CIRC);

  function ringStatusMessage(pct, total) {
    if (!total) return "";
    if (pct >= 100) return "今月の予定はすべて完了しました";
    if (currentKey === monthKey(today)) {
      const lastDay = currentMonthLastDay();
      const expected = Math.round((today.getDate() / lastDay) * 100);
      if (pct >= expected) return "いいペースで進んでいます";
      return "焦らず、ひとつずつ進めましょう";
    }
    return "";
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function editIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M11.3 2.3a1.4 1.4 0 0 1 2 2L5.5 12.1l-2.8.7.7-2.8L11.3 2.3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  const CATEGORY_LABELS = { agency: "運用代行", own: "自身アカウント", other: "その他" };
  let editingId = null;

  function renderTaskRow(task) {
    if (task.id === editingId) return renderEditRow(task);

    const row = document.createElement("div");
    row.className = "task-row" + (task.done ? " done" : "");

    const chk = document.createElement("button");
    chk.className = "chk" + (task.done ? " done" : "");
    chk.innerHTML = checkIcon();
    chk.setAttribute("aria-label", task.done ? "完了を取り消す" : "完了にする");
    chk.addEventListener("click", () => toggleTask(task.id));

    const title = document.createElement("div");
    title.className = "title";
    if (task.category && CATEGORY_LABELS[task.category]) {
      const dot = document.createElement("i");
      dot.className = "cat-dot cat-" + task.category;
      dot.title = CATEGORY_LABELS[task.category];
      title.appendChild(dot);
    }
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = task.title;
    title.appendChild(label);

    row.appendChild(chk);
    row.appendChild(title);

    const edit = document.createElement("button");
    edit.className = "del edit-btn";
    edit.innerHTML = editIcon();
    edit.setAttribute("aria-label", "編集");
    edit.addEventListener("click", () => { editingId = task.id; render(); });
    row.appendChild(edit);

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "削除");
    del.addEventListener("click", () => deleteTask(task.id));
    row.appendChild(del);

    return row;
  }

  function renderEditRow(task) {
    const row = document.createElement("div");
    row.className = "task-row task-edit";

    const titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.className = "edit-title";
    titleInput.value = task.title;
    titleInput.required = true;

    const categorySelect = document.createElement("select");
    categorySelect.className = "edit-category";
    Object.keys(CATEGORY_LABELS).forEach(key => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = CATEGORY_LABELS[key];
      if (task.category === key) opt.selected = true;
      categorySelect.appendChild(opt);
    });

    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.className = "edit-date";
    dateInput.value = task.date;
    dateInput.required = true;

    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "edit-save";
    saveBtn.innerHTML = checkIcon();
    saveBtn.setAttribute("aria-label", "保存");

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "edit-cancel";
    cancelBtn.textContent = "×";
    cancelBtn.setAttribute("aria-label", "編集をやめる");

    const doSave = () => {
      const title = titleInput.value.trim();
      const date = dateInput.value;
      if (!title || !date) return;
      saveTaskEdit(task, title, categorySelect.value, date);
    };
    saveBtn.addEventListener("click", doSave);
    cancelBtn.addEventListener("click", () => { editingId = null; render(); });
    titleInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); doSave(); }
      if (e.key === "Escape") { editingId = null; render(); }
    });

    const line1 = document.createElement("div");
    line1.className = "edit-row";
    line1.appendChild(titleInput);

    const line2 = document.createElement("div");
    line2.className = "edit-row";
    line2.appendChild(categorySelect);
    line2.appendChild(dateInput);
    line2.appendChild(saveBtn);
    line2.appendChild(cancelBtn);

    row.appendChild(line1);
    row.appendChild(line2);
    return row;
  }

  function saveTaskEdit(task, newTitle, newCategory, newDate) {
    const oldKey = task.date.slice(0, 7);
    const oldMonthTasks = loadTasks(oldKey);
    const idx = oldMonthTasks.findIndex(t => t.id === task.id);
    if (idx === -1) { editingId = null; render(); return; }

    const updated = Object.assign({}, oldMonthTasks[idx], {
      title: newTitle, category: newCategory, date: newDate
    });
    oldMonthTasks.splice(idx, 1);
    saveTasks(oldKey, oldMonthTasks);

    const newKey = newDate.slice(0, 7);
    const newMonthTasks = newKey === oldKey ? oldMonthTasks : loadTasks(newKey);
    newMonthTasks.push(updated);
    saveTasks(newKey, newMonthTasks);

    if (newKey !== monthKey(viewDate)) {
      const [yy, mm] = newKey.split("-").map(Number);
      viewDate = new Date(yy, mm - 1, 1);
    }
    editingId = null;
    render();
  }

  let currentKey = "";
  let currentTasks = [];

  function currentMonthLastDay() {
    return new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
  }

  function render() {
    currentKey = monthKey(viewDate);
    currentTasks = loadTasks(currentKey);

    monthTitleEl.textContent = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月`;
    todayDateEl.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日（${WEEKDAYS[today.getDay()]}）`;

    goalInputEl.value = loadGoal(currentKey);

    // stats (whole month)
    const total = currentTasks.length;
    const done = currentTasks.filter(t => t.done).length;
    const overdue = currentTasks.filter(t => !t.done && new Date(t.date + "T00:00:00") < today).length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    pctTextEl.textContent = pct;
    doneOfTotalEl.textContent = `${done} / ${total} 件完了`;
    statRemainingEl.textContent = total - done;
    statOverdueEl.textContent = overdue;
    ringStatusEl.textContent = ringStatusMessage(pct, total);
    const offset = RING_CIRC * (1 - pct / 100);
    ringProgressEl.style.strokeDashoffset = String(offset);

    // today list — only meaningful when viewing the actual current month,
    // otherwise show what's due on the 1st as a neutral placeholder is confusing,
    // so we always compute against the real "today" regardless of viewDate.
    renderTodayList();

    // seed banner
    seedBannerWrap.innerHTML = "";
    if (seedBannerShown && currentKey === monthKey(today)) {
      const b = document.createElement("div");
      b.className = "seed-banner";
      b.innerHTML = `<span>サンプルのタスクを用意しました。内容は自由に編集・削除してください。</span>`;
      const btn = document.createElement("button");
      btn.textContent = "閉じる";
      btn.addEventListener("click", () => { seedBannerShown = false; render(); });
      b.appendChild(btn);
      seedBannerWrap.appendChild(b);
    }

    renderWeeks();
  }

  function renderTodayList() {
    todayListEl.innerHTML = "";
    const key = monthKey(today);
    const tasks = key === currentKey ? currentTasks : loadTasks(key);
    const todayISO = toISO(today);
    const dueToday = tasks.filter(t => t.date === todayISO);

    if (!dueToday.length) {
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "今日の予定はありません。左のフォームからタスクを追加できます。";
      todayListEl.appendChild(empty);
      return;
    }

    dueToday.forEach(t => todayListEl.appendChild(renderTaskRow(t)));
  }

  function renderWeeks() {
    weeksEl.innerHTML = "";
    const lastDay = currentMonthLastDay();
    const year = viewDate.getFullYear(), month = viewDate.getMonth();

    let day = 1;
    while (day <= lastDay) {
      const weekStart = day;
      const weekCard = document.createElement("div");
      weekCard.className = "week-card";

      const daysThisWeek = [];
      const firstWeekday = new Date(year, month, day).getDay();
      let remainingInWeek = 7 - firstWeekday;
      for (let i = 0; i < remainingInWeek && day <= lastDay; i++, day++) {
        daysThisWeek.push(day);
      }

      const weekTasks = currentTasks.filter(t => {
        const dd = Number(t.date.slice(8, 10));
        return dd >= weekStart && dd <= daysThisWeek[daysThisWeek.length - 1];
      });
      const weekDone = weekTasks.filter(t => t.done).length;

      const head = document.createElement("div");
      head.className = "week-head";
      head.innerHTML = `<span class="label">${weekStart}日〜${daysThisWeek[daysThisWeek.length - 1]}日</span>
                         <span class="frac">${weekDone} / ${weekTasks.length}</span>`;
      weekCard.appendChild(head);

      daysThisWeek.forEach(d => {
        const iso = toISO(new Date(year, month, d));
        const isToday = iso === toISO(today);
        const dayTasks = currentTasks.filter(t => t.date === iso)
          .sort((a, b) => Number(a.done) - Number(b.done));

        const row = document.createElement("div");
        row.className = "day-row" + (isToday ? " today" : "");

        const num = document.createElement("div");
        num.className = "day-num";
        num.innerHTML = `<span class="n">${d}</span><span class="w">${WEEKDAYS[new Date(year, month, d).getDay()]}</span>`;
        row.appendChild(num);

        const list = document.createElement("div");
        list.className = "day-tasks";
        if (!dayTasks.length) {
          const empty = document.createElement("div");
          empty.className = "empty-note";
          empty.textContent = "予定なし";
          list.appendChild(empty);
        } else {
          dayTasks.forEach(t => list.appendChild(renderTaskRow(t)));
        }
        row.appendChild(list);
        weekCard.appendChild(row);
      });

      weeksEl.appendChild(weekCard);
    }
  }

  function toggleTask(id) {
    const t = currentTasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTasks(currentKey, currentTasks);
    render();
  }

  function deleteTask(id) {
    currentTasks = currentTasks.filter(t => t.id !== id);
    saveTasks(currentKey, currentTasks);
    render();
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });

  goalInputEl.addEventListener("input", () => saveGoal(currentKey, goalInputEl.value));

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const titleEl = document.getElementById("taskTitle");
    const categoryEl = document.getElementById("taskCategory");

    const title = titleEl.value.trim();
    const category = categoryEl.value;
    const dates = [...selectedDates].sort();
    if (!title || !dates.length) {
      if (!dates.length) openDatePicker();
      return;
    }

    // dates may span multiple months, so group writes by month key
    const byMonth = new Map();
    dates.forEach(d => {
      const key = d.slice(0, 7);
      if (!byMonth.has(key)) byMonth.set(key, key === currentKey ? currentTasks : loadTasks(key));
      byMonth.get(key).push({ id: uid(), date: d, title, category, done: false });
    });
    byMonth.forEach((tasks, key) => saveTasks(key, tasks));

    // jump to the month of the earliest selected date
    const [yy, mm] = dates[0].slice(0, 7).split("-").map(Number);
    viewDate = new Date(yy, mm - 1, 1);

    titleEl.value = "";
    categoryEl.value = "agency";
    selectedDates.clear();
    selectedDates.add(toISO(today));
    dpViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
    renderDatePicker();
    updateDatePickerSummary();
    render();
  });

  document.getElementById("resetTemplateBtn").addEventListener("click", () => {
    const label = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月`;
    const ok = window.confirm(`${label}のタスクをテンプレートで入れ直します。この月に追加・編集した内容は失われます。よろしいですか？`);
    if (!ok) return;
    const key = monthKey(viewDate);
    saveTasks(key, buildTemplateTasks(viewDate.getFullYear(), viewDate.getMonth()));
    render();
  });

  seedIfNeeded();
  render();
})();
</script>
</body>
</html>
