<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>月間タスク管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f6;
    --surface: #ffffff;
    --surface-2: #f2ece9;
    --border: #e4dcd7;
    --ink: #2a2522;
    --text: #2a2522;
    --text-muted: #8d8079;
    --accent: #b3717a;
    --accent-soft: #f3e3e2;
    --accent-contrast: #ffffff;
    --ink-contrast: #faf8f6;
    --good: #7c8a70;
    --good-soft: #eaece2;
    --cat-other: #ab8a4c;
    --danger: #a5644f;
    --danger-soft: #f1e2da;
    --ring-track: #ece4e0;
    --shadow: 0 1px 2px rgba(42,37,34,0.04), 0 10px 28px -18px rgba(42,37,34,0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18161a;
      --surface: #201d21;
      --surface-2: #29262a;
      --border: #3a353a;
      --ink: #f1ece8;
      --text: #f1ece8;
      --text-muted: #a89e9b;
      --accent: #d99aa1;
      --accent-soft: #372a2c;
      --accent-contrast: #221316;
      --ink-contrast: #18161a;
      --good: #a0ac93;
      --good-soft: #2b2f26;
      --cat-other: #cdab6c;
      --danger: #cb8872;
      --danger-soft: #33241f;
      --ring-track: #332f33;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -18px rgba(0,0,0,0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #18161a;
    --surface: #201d21;
    --surface-2: #29262a;
    --border: #3a353a;
    --ink: #f1ece8;
    --text: #f1ece8;
    --text-muted: #a89e9b;
    --accent: #d99aa1;
    --accent-soft: #372a2c;
    --accent-contrast: #221316;
    --ink-contrast: #18161a;
    --good: #a0ac93;
    --good-soft: #2b2f26;
    --cat-other: #cdab6c;
    --danger: #cb8872;
    --danger-soft: #33241f;
    --ring-track: #332f33;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -18px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 100px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 40px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; padding: 32px 20px 72px; gap: 32px; }
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }

  .brand {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @media (min-width: 861px) {
    .sidebar {
      position: sticky;
      top: 24px;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 28px 26px;
    box-shadow: var(--shadow);
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .month-nav button {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s;
  }
  .month-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .month-nav button:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 1px solid var(--accent); outline-offset: 3px;
  }

  .month-title {
    font-family: "Shippori Mincho", serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .ring-wrap {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .ring-num .pct-line {
    font-family: "Shippori Mincho", serif;
    line-height: 1;
  }
  .ring-num .pct { font-size: 34px; font-weight: 600; }
  .ring-num .pct-sign { font-size: 15px; color: var(--text-muted); margin-left: 1px; }
  .ring-num .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }
  .status {
    font-family: "Shippori Mincho", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--accent);
    margin-top: 16px;
    min-height: 1.3em;
    text-wrap: balance;
  }

  .stat-row {
    display: flex;
    margin-top: 26px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .stat {
    flex: 1;
    padding-right: 16px;
  }
  .stat + .stat { border-left: 1px solid var(--border); padding-left: 16px; }
  .stat .n {
    font-family: "Shippori Mincho", serif;
    font-size: 22px;
    font-weight: 500;
  }
  .stat .l {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .stat.danger .n { color: var(--danger); }

  .goal-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 9px;
  }
  .goal-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 0;
    padding: 4px 1px 8px;
    font-size: 13.5px;
    font-family: inherit;
    transition: border-color .15s;
  }
  .goal-input:focus { border-bottom-color: var(--accent); outline: none; }

  form.add-task { display: flex; flex-direction: column; gap: 18px; }
  .field label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  .field input[type="text"], .field input[type="date"], .field select {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 0;
    padding: 4px 1px 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-bottom-color: var(--accent); outline: none; }
  .field-row { display: flex; gap: 18px; }
  .field-row .field { flex: 1; }

  button.primary {
    background: var(--ink);
    color: var(--ink-contrast);
    border: none;
    border-radius: 2px;
    padding: 13px 14px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .15s;
  }
  button.primary:hover { opacity: 0.82; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .text-link {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
  }
  .text-link:hover { color: var(--accent); text-decoration-color: var(--accent); }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; gap: 22px; }

  .today-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px 34px;
    box-shadow: var(--shadow);
  }
  .today-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .today-head .today-title {
    font-family: "Shippori Mincho", serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  .today-head .today-date {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .task-list { display: flex; flex-direction: column; }

  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--border);
  }
  .task-list .task-row:last-child { border-bottom: none; }

  .task-row .chk {
    width: 19px; height: 19px;
    border-radius: 50%;
    border: 1px solid var(--text-muted);
    background: transparent;
    cursor: pointer;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast);
    transition: background .15s, border-color .15s;
  }
  .task-row .chk:hover { border-color: var(--accent); }
  .task-row .chk.done { background: var(--accent); border-color: var(--accent); }
  .task-row .chk svg { width: 11px; height: 11px; display: none; }
  .task-row .chk.done svg { display: block; }

  .task-row .title {
    flex: 1;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
  }
  .task-row.done .title { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--border); }
  .task-row .title .label { overflow-wrap: anywhere; }

  .cat-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    flex: none;
    position: relative;
    top: -1px;
  }
  .cat-dot.cat-agency { background: var(--accent); }
  .cat-dot.cat-own { background: var(--good); }
  .cat-dot.cat-other { background: var(--cat-other); }

  .task-row .badge {
    font-family: "Shippori Mincho", serif;
    font-style: italic;
    font-size: 12px;
    color: var(--danger);
    flex: none;
  }

  .task-row .del {
    flex: none;
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    opacity: 0;
    transition: opacity .15s;
  }
  .task-row:hover .del { opacity: 1; }
  .task-row .del:hover { color: var(--danger); }

  .empty-note {
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    font-family: "Shippori Mincho", serif;
    padding: 10px 2px;
  }

  .seed-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    color: var(--text);
    border-radius: 0;
    padding: 13px 18px;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .seed-banner button {
    background: transparent;
    border: none;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    font-size: 12px;
    flex: none;
  }

  .weeks { display: flex; flex-direction: column; gap: 18px; }

  .week-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
  }
  .week-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .week-head .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--text-muted);
  }
  .week-head .frac {
    font-family: "Shippori Mincho", serif;
    font-size: 13px;
    color: var(--text-muted);
  }

  .day-row {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 16px;
    padding: 11px 0;
    border-top: 1px solid var(--border);
  }
  .day-row:first-of-type { border-top: none; }
  .day-row.today { border-left: 2px solid var(--accent); padding-left: 12px; margin-left: -14px; }

  .day-num {
    font-family: "Shippori Mincho", serif;
    padding-top: 9px;
  }
  .day-num .n { font-size: 17px; font-weight: 500; }
  .day-num .w { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; font-family: "Zen Kaku Gothic New", sans-serif; letter-spacing: 0.05em; }

  .day-tasks { display: flex; flex-direction: column; }
  .day-tasks .task-row { border-bottom: none; padding: 6px 2px; }
  .day-tasks .empty-note { padding: 9px 2px; font-size: 12.5px; }

  footer.hint {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">月間タスク管理</div>

    <div class="card">
      <div class="month-nav">
        <button id="prevMonth" aria-label="前の月">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button id="nextMonth" aria-label="次の月">›</button>
      </div>

      <div class="ring-wrap">
        <svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="今月の達成率">
          <circle cx="42" cy="42" r="37" fill="none" stroke="var(--ring-track)" stroke-width="2.5"/>
          <circle id="ringProgress" cx="42" cy="42" r="37" fill="none" stroke="var(--accent)" stroke-width="2.5"
                  stroke-linecap="round" transform="rotate(-90 42 42)"/>
        </svg>
        <div class="ring-num">
          <div class="pct-line"><span class="pct" id="pctText">0</span><span class="pct-sign">%</span></div>
          <div class="sub" id="doneOfTotal">0 / 0 件完了</div>
        </div>
      </div>
      <div class="status" id="ringStatus"></div>

      <div class="stat-row">
        <div class="stat">
          <div class="n" id="statRemaining">0</div>
          <div class="l">残タスク</div>
        </div>
        <div class="stat danger">
          <div class="n" id="statOverdue">0</div>
          <div class="l">期限超過</div>
        </div>
      </div>

      <div style="margin-top:16px;">
        <div class="goal-label">今月の目標</div>
        <input class="goal-input" id="goalInput" type="text" placeholder="例：クライアント対応と自分の投稿、両方を滞りなく進める" />
      </div>
    </div>

    <div class="card">
      <div class="goal-label" style="margin-bottom:12px;">タスクを追加</div>
      <form class="add-task" id="addForm">
        <div class="field">
          <label for="taskTitle">やること</label>
          <input type="text" id="taskTitle" placeholder="例：「工務店」投稿作成" required />
        </div>
        <div class="field">
          <label for="taskCategory">分類</label>
          <select id="taskCategory">
            <option value="agency">運用代行</option>
            <option value="own">自身アカウント</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="taskDate">日付</label>
            <input type="date" id="taskDate" required />
          </div>
          <div class="field">
            <label for="taskRepeat">繰り返し</label>
            <select id="taskRepeat">
              <option value="once">この日だけ</option>
              <option value="daily">月末まで毎日</option>
              <option value="weekly">月末まで毎週この曜日</option>
            </select>
          </div>
        </div>
        <button type="submit" class="primary">追加する</button>
      </form>

      <div class="legend">
        <span><i class="cat-dot cat-agency"></i>運用代行</span>
        <span><i class="cat-dot cat-own"></i>自身アカウント</span>
        <span><i class="cat-dot cat-other"></i>その他</span>
      </div>
    </div>

    <button type="button" class="text-link" id="resetTemplateBtn">この月をテンプレートで入れ直す</button>
  </aside>

  <main class="main">
    <section class="today-card">
      <div class="today-head">
        <div class="today-title">今日やること</div>
        <div class="today-date" id="todayDate"></div>
      </div>
      <div class="task-list" id="todayList"></div>
    </section>

    <section>
      <div id="seedBannerWrap"></div>
      <div class="weeks" id="weeks"></div>
      <footer class="hint">タスクはこの端末のブラウザ内に保存されます（他の端末とは共有されません）。</footer>
    </section>
  </main>

</div>

<script>
(function () {
  "use strict";

  const STORAGE_PREFIX = "mtm:tasks:";
  const GOAL_PREFIX = "mtm:goal:";
  const SEED_FLAG = "mtm:seeded";

  const pad2 = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const monthKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

  const WEEKDAYS = ["日","月","火","水","木","金","土"];

  let today = startOfDay(new Date());
  let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

  function loadTasks(key) {
    try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + key)) || []; }
    catch (e) { return []; }
  }
  function saveTasks(key, tasks) {
    try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(tasks)); } catch (e) {}
  }
  function loadGoal(key) {
    try { return localStorage.getItem(GOAL_PREFIX + key) || ""; } catch (e) { return ""; }
  }
  function saveGoal(key, val) {
    try { localStorage.setItem(GOAL_PREFIX + key, val); } catch (e) {}
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }

  // 大枠の項目（運用代行 / 自身アカウント / その他）に沿った月間テンプレート。
  // day は「その月の何日」を指す（末日を超える分は末日にまとめる）。
  const TEMPLATE = [
    { day: 2,  title: "「工務店」投稿作成", category: "agency" },
    { day: 3,  title: "「タイ古式マッサージ店」ストーリー更新", category: "agency" },
    { day: 4,  title: "リール撮影", category: "own" },
    { day: 5,  title: "リール編集", category: "own" },
    { day: 6,  title: "「タイ古式マッサージ店」投稿作成", category: "agency" },
    { day: 8,  title: "「工務店」投稿作成", category: "agency" },
    { day: 9,  title: "自身アカウント ストーリー更新", category: "own" },
    { day: 11, title: "リール作成（投稿）", category: "own" },
    { day: 13, title: "「タイ古式マッサージ店」ストーリー更新", category: "agency" },
    { day: 15, title: "「工務店」投稿作成", category: "agency" },
    { day: 17, title: "「タイ古式マッサージ店」投稿作成", category: "agency" },
    { day: 20, title: "自身アカウント ストーリー更新", category: "own" },
    { day: 22, title: "「工務店」投稿作成", category: "agency" },
    { day: 25, title: "リール撮影", category: "own" },
    { day: 27, title: "リール編集", category: "own" },
    { day: 28, title: "請求書作成", category: "other" },
    { day: 30, title: "振り返りシート・成果報告書を提出", category: "other" },
  ];

  function buildTemplateTasks(year, month) {
    const lastDay = new Date(year, month + 1, 0).getDate();
    const clamp = n => Math.min(Math.max(n, 1), lastDay);
    return TEMPLATE.map(t => {
      const date = toISO(new Date(year, month, clamp(t.day)));
      return { id: uid(), date, title: t.title, category: t.category, done: date < toISO(today) };
    });
  }

  function seedIfNeeded() {
    try { if (localStorage.getItem(SEED_FLAG)) return; } catch (e) { return; }
    const key = monthKey(today);
    const existing = loadTasks(key);
    if (existing.length) { localStorage.setItem(SEED_FLAG, "1"); return; }

    saveTasks(key, buildTemplateTasks(today.getFullYear(), today.getMonth()));
    saveGoal(key, "クライアント対応と自分の投稿、両方を滞りなく進める");
    localStorage.setItem(SEED_FLAG, "1");
    showSeedBanner();
  }

  let seedBannerShown = false;
  function showSeedBanner() { seedBannerShown = true; }

  function generateOccurrences(baseDateStr, repeat) {
    const base = new Date(baseDateStr + "T00:00:00");
    const lastDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const dates = [];
    if (repeat === "once") {
      dates.push(toISO(base));
    } else if (repeat === "daily") {
      for (let d = base.getDate(); d <= lastDay; d++) {
        dates.push(toISO(new Date(base.getFullYear(), base.getMonth(), d)));
      }
    } else if (repeat === "weekly") {
      for (let d = base.getDate(); d <= lastDay; d += 7) {
        dates.push(toISO(new Date(base.getFullYear(), base.getMonth(), d)));
      }
    }
    return dates;
  }

  // ---------- rendering ----------

  const monthTitleEl = document.getElementById("monthTitle");
  const todayDateEl = document.getElementById("todayDate");
  const todayListEl = document.getElementById("todayList");
  const weeksEl = document.getElementById("weeks");
  const pctTextEl = document.getElementById("pctText");
  const doneOfTotalEl = document.getElementById("doneOfTotal");
  const statRemainingEl = document.getElementById("statRemaining");
  const statOverdueEl = document.getElementById("statOverdue");
  const ringProgressEl = document.getElementById("ringProgress");
  const goalInputEl = document.getElementById("goalInput");
  const seedBannerWrap = document.getElementById("seedBannerWrap");
  const ringStatusEl = document.getElementById("ringStatus");
  const RING_CIRC = 2 * Math.PI * 37;
  ringProgressEl.style.strokeDasharray = String(RING_CIRC);

  function ringStatusMessage(pct, total) {
    if (!total) return "";
    if (pct >= 100) return "今月の予定はすべて完了しました";
    if (currentKey === monthKey(today)) {
      const lastDay = currentMonthLastDay();
      const expected = Math.round((today.getDate() / lastDay) * 100);
      if (pct >= expected) return "いいペースで進んでいます";
      return "焦らず、ひとつずつ進めましょう";
    }
    return "";
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  const CATEGORY_LABELS = { agency: "運用代行", own: "自身アカウント", other: "その他" };

  function renderTaskRow(task, opts) {
    opts = opts || {};
    const row = document.createElement("div");
    row.className = "task-row" + (task.done ? " done" : "");

    const chk = document.createElement("button");
    chk.className = "chk" + (task.done ? " done" : "");
    chk.innerHTML = checkIcon();
    chk.setAttribute("aria-label", task.done ? "完了を取り消す" : "完了にする");
    chk.addEventListener("click", () => toggleTask(task.id));

    const title = document.createElement("div");
    title.className = "title";
    if (task.category && CATEGORY_LABELS[task.category]) {
      const dot = document.createElement("i");
      dot.className = "cat-dot cat-" + task.category;
      dot.title = CATEGORY_LABELS[task.category];
      title.appendChild(dot);
    }
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = task.title;
    title.appendChild(label);

    row.appendChild(chk);
    row.appendChild(title);

    if (opts.badge) {
      const badge = document.createElement("span");
      badge.className = "badge" + (opts.overdue ? " overdue" : "");
      badge.textContent = opts.badge;
      row.appendChild(badge);
    }

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.setAttribute("aria-label", "削除");
    del.addEventListener("click", () => deleteTask(task.id));
    row.appendChild(del);

    return row;
  }

  let currentKey = "";
  let currentTasks = [];

  function currentMonthLastDay() {
    return new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
  }

  function render() {
    currentKey = monthKey(viewDate);
    currentTasks = loadTasks(currentKey);

    monthTitleEl.textContent = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月`;
    todayDateEl.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日（${WEEKDAYS[today.getDay()]}）`;

    goalInputEl.value = loadGoal(currentKey);

    // stats (whole month)
    const total = currentTasks.length;
    const done = currentTasks.filter(t => t.done).length;
    const overdue = currentTasks.filter(t => !t.done && new Date(t.date + "T00:00:00") < today).length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    pctTextEl.textContent = pct;
    doneOfTotalEl.textContent = `${done} / ${total} 件完了`;
    statRemainingEl.textContent = total - done;
    statOverdueEl.textContent = overdue;
    ringStatusEl.textContent = ringStatusMessage(pct, total);
    const offset = RING_CIRC * (1 - pct / 100);
    ringProgressEl.style.strokeDashoffset = String(offset);

    // today list — only meaningful when viewing the actual current month,
    // otherwise show what's due on the 1st as a neutral placeholder is confusing,
    // so we always compute against the real "today" regardless of viewDate.
    renderTodayList();

    // seed banner
    seedBannerWrap.innerHTML = "";
    if (seedBannerShown && currentKey === monthKey(today)) {
      const b = document.createElement("div");
      b.className = "seed-banner";
      b.innerHTML = `<span>サンプルのタスクを用意しました。内容は自由に編集・削除してください。</span>`;
      const btn = document.createElement("button");
      btn.textContent = "閉じる";
      btn.addEventListener("click", () => { seedBannerShown = false; render(); });
      b.appendChild(btn);
      seedBannerWrap.appendChild(b);
    }

    renderWeeks();
  }

  function renderTodayList() {
    todayListEl.innerHTML = "";
    const key = monthKey(today);
    const tasks = key === currentKey ? currentTasks : loadTasks(key);
    const todayISO = toISO(today);

    const dueToday = tasks.filter(t => t.date === todayISO);
    const overdue = tasks.filter(t => !t.done && t.date < todayISO);

    if (!dueToday.length && !overdue.length) {
      const empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "今日の予定はありません。左のフォームからタスクを追加できます。";
      todayListEl.appendChild(empty);
      return;
    }

    overdue.sort((a, b) => a.date.localeCompare(b.date));
    overdue.forEach(t => {
      const daysLate = Math.round((today - new Date(t.date + "T00:00:00")) / 86400000);
      todayListEl.appendChild(renderTaskRow(t, { badge: `${daysLate}日超過`, overdue: true }));
    });
    dueToday.forEach(t => todayListEl.appendChild(renderTaskRow(t)));
  }

  function renderWeeks() {
    weeksEl.innerHTML = "";
    const lastDay = currentMonthLastDay();
    const year = viewDate.getFullYear(), month = viewDate.getMonth();

    let day = 1;
    while (day <= lastDay) {
      const weekStart = day;
      const weekCard = document.createElement("div");
      weekCard.className = "week-card";

      const daysThisWeek = [];
      const firstWeekday = new Date(year, month, day).getDay();
      let remainingInWeek = 7 - firstWeekday;
      for (let i = 0; i < remainingInWeek && day <= lastDay; i++, day++) {
        daysThisWeek.push(day);
      }

      const weekTasks = currentTasks.filter(t => {
        const dd = Number(t.date.slice(8, 10));
        return dd >= weekStart && dd <= daysThisWeek[daysThisWeek.length - 1];
      });
      const weekDone = weekTasks.filter(t => t.done).length;

      const head = document.createElement("div");
      head.className = "week-head";
      head.innerHTML = `<span class="label">${weekStart}日〜${daysThisWeek[daysThisWeek.length - 1]}日</span>
                         <span class="frac">${weekDone} / ${weekTasks.length}</span>`;
      weekCard.appendChild(head);

      daysThisWeek.forEach(d => {
        const iso = toISO(new Date(year, month, d));
        const isToday = iso === toISO(today);
        const dayTasks = currentTasks.filter(t => t.date === iso)
          .sort((a, b) => Number(a.done) - Number(b.done));

        const row = document.createElement("div");
        row.className = "day-row" + (isToday ? " today" : "");

        const num = document.createElement("div");
        num.className = "day-num";
        num.innerHTML = `<span class="n">${d}</span><span class="w">${WEEKDAYS[new Date(year, month, d).getDay()]}</span>`;
        row.appendChild(num);

        const list = document.createElement("div");
        list.className = "day-tasks";
        if (!dayTasks.length) {
          const empty = document.createElement("div");
          empty.className = "empty-note";
          empty.textContent = "予定なし";
          list.appendChild(empty);
        } else {
          dayTasks.forEach(t => list.appendChild(renderTaskRow(t)));
        }
        row.appendChild(list);
        weekCard.appendChild(row);
      });

      weeksEl.appendChild(weekCard);
    }
  }

  function toggleTask(id) {
    const t = currentTasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTasks(currentKey, currentTasks);
    render();
  }

  function deleteTask(id) {
    currentTasks = currentTasks.filter(t => t.id !== id);
    saveTasks(currentKey, currentTasks);
    render();
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });

  goalInputEl.addEventListener("input", () => saveGoal(currentKey, goalInputEl.value));

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const titleEl = document.getElementById("taskTitle");
    const categoryEl = document.getElementById("taskCategory");
    const dateEl = document.getElementById("taskDate");
    const repeatEl = document.getElementById("taskRepeat");

    const title = titleEl.value.trim();
    const category = categoryEl.value;
    const dateVal = dateEl.value;
    if (!title || !dateVal) return;

    const dates = generateOccurrences(dateVal, repeatEl.value);
    const targetKey = dateVal.slice(0, 7);
    const targetTasks = targetKey === currentKey ? currentTasks : loadTasks(targetKey);

    dates.forEach(d => targetTasks.push({ id: uid(), date: d, title, category, done: false }));
    saveTasks(targetKey, targetTasks);

    // jump to the month the new task(s) belong to
    const [yy, mm] = targetKey.split("-").map(Number);
    viewDate = new Date(yy, mm - 1, 1);

    titleEl.value = "";
    dateEl.value = "";
    categoryEl.value = "agency";
    repeatEl.value = "once";
    render();
  });

  document.getElementById("resetTemplateBtn").addEventListener("click", () => {
    const label = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月`;
    const ok = window.confirm(`${label}のタスクをテンプレートで入れ直します。この月に追加・編集した内容は失われます。よろしいですか？`);
    if (!ok) return;
    const key = monthKey(viewDate);
    saveTasks(key, buildTemplateTasks(viewDate.getFullYear(), viewDate.getMonth()));
    render();
  });

  document.getElementById("taskDate").value = toISO(today);

  seedIfNeeded();
  render();
})();
</script>
</body>
</html>
